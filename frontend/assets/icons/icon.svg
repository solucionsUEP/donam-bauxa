<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dona'm Bauxa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#191925"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#b5ff4d" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="#b5ff4d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b5ff4d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- DB monogram -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="320" font-size="240" fill="#ffffff">D<tspan fill="#b5ff4d">B</tspan></text>
  </g>
  <!-- Music staff accent -->
  <g stroke="#b5ff4d" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <circle cx="160" cy="392" r="14" fill="#b5ff4d" stroke="none"/>
    <path d="M174 392 L174 332" fill="none"/>
    <path d="M174 332 Q220 320 240 348" fill="none"/>
  </g>
</svg>
